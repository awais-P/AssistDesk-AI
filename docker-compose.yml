services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assistdesk}
      POSTGRES_USER: ${POSTGRES_USER:-assistdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistdesk-dev-password}
    ports:
      - "5433:5432"
    volumes:
      - assistdesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  assistdesk-postgres-data:
