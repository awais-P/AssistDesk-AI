  <!-- 45-degree Angled Mic Stem + Precision Diamond Spark -->
  <path d="M 215 180 L 215 210 L 175 230" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="165,230 170,225 175,230 170,235" fill="#FFFFFF" />
