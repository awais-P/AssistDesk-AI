<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Background -->
  <rect width="600" height="600" fill="#000000" />

  <!-- Outer Fine Boundary -->
  <rect x="160" y="110" width="280" height="280" rx="40" fill="none" stroke="#1f1f23" stroke-width="1.5" />

  <!-- Semicircle Crown Arch with Clean Flat Cuts -->
  <path d="M 225 240 A 75 75 0 0 1 375 240" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="butt" />

  <!-- Symmetrical Lateral Ear Slabs (8px vertical gap below arch) -->
  <rect x="217" y="248" width="16" height="54" rx="8" fill="#FFFFFF" />
  <rect x="367" y="248" width="16" height="54" rx="8" fill="#FFFFFF" />

  <!-- The 'A' Crossbar (Floating Data Plank) -->
  <rect x="245" y="252" width="110" height="8" rx="4" fill="#FFFFFF" />

  <!-- 45-degree Angled Mic Stem + Precision Diamond Spark -->
  <path d="M 375 290 L 375 320 L 335 340" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="325,340 330,335 335,340 330,345" fill="#FFFFFF" />

  <!-- Ultra-Clean Monospaced / Sans Typography -->
  <text x="300" y="475" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
        font-size="30" 
        font-weight="700" 
        letter-spacing="12" 
        fill="#FFFFFF" 
        text-anchor="middle">ASSISTDESK</text>
</svg>
